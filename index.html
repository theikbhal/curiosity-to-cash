<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curiosity → Cash</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #020617;
      border-bottom: 1px solid #1e293b;
    }

    header h1 {
      font-size: 1.4rem;
      margin: 0;
    }

    header p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card span {
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .card p {
      margin: 6px 0 0;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>

<body>

  <header>
    <h1>Curiosity → Cash</h1>
    <p>Real solo founders who monetized curiosity</p>
  </header>

  <main id="list">
    <p>Loading examples…</p>
  </main>

  <footer>
    Built in public • Single HTML + JSON
  </footer>

  <script>
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("list");
        container.innerHTML = "";

        data.forEach(item => {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `
            <span>#${item.id}</span>
            <p>${item.text}</p>
          `;
          container.appendChild(div);
        });
      })
      .catch(err => {
        document.getElementById("list").innerHTML =
          "<p>Failed to load data.</p>";
        console.error(err);
      });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curiosity → Cash</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #e5e7eb;
      background: linear-gradient(to bottom, #020617, #0f172a 40%, #020617);
      overflow-x: hidden;
    }

    /* ---------- MIST LAYER ---------- */
    .mist {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at bottom, rgba(255,255,255,0.06), transparent 60%);
      animation: mistMove 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes mistMove {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* ---------- RAIN ---------- */
    .rain {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(
        rgba(255,255,255,0.05) 1px,
        transparent 1px
      );
      background-size: 2px 18px;
      animation: rainFall 1.5s linear infinite;
      pointer-events: none;
      opacity: 0.15;
    }

    @keyframes rainFall {
      from { background-position: 0 0; }
      to { background-position: 0 18px; }
    }

    /* ---------- FLOATING GROUPS ---------- */
    .group {
      position: fixed;
      opacity: 0.22;
      pointer-events: none;
    }

    .trees {
      bottom: 8%;
      left: 6%;
      animation: sway 6s ease-in-out infinite;
    }

    .mountains {
      bottom: 10%;
      right: 6%;
      opacity: 0.18;
    }

    .clouds {
      top: 18%;
      left: 10%;
      animation: cloudFloat 14s ease-in-out infinite;
    }

    .sun {
      top: 8%;
      right: 12%;
      animation: glow 8s ease-in-out infinite;
    }

    .birds {
      top: 32%;
      right: 20%;
      animation: birdFloat 10s ease-in-out infinite;
    }

    @keyframes sway {
      0%,100% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg); }
    }

    @keyframes cloudFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes glow {
      0%,100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.08); opacity: 0.35; }
    }

    @keyframes birdFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    header {
      padding: 18px 16px;
      text-align: center;
      background: rgba(2,6,23,0.82);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #1e293b;
      position: relative;
      z-index: 2;
    }

    .coffee-btn {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 16px;
      font-size: 0.85rem;
      background: #facc15;
      color: #000;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    header h1 {
      font-size: 1.6rem;
      margin: 6px 0 4px;
    }

    header p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0;
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(2,6,23,0.86);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(56,189,248,0.12);
    }

    .card span {
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .card p {
      margin: 6px 0 0;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.75rem;
      color: #64748b;
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- atmosphere -->
  <div class="mist"></div>
  <div class="rain"></div>

  <!-- nature groups -->
  <div class="group trees">🌲 🌲 🌳</div>
  <div class="group mountains">⛰️ ⛰️</div>
  <div class="group clouds">☁️ ☁️ ☁️</div>
  <div class="group sun">☀️</div>
  <div class="group birds">🕊️ 🕊️ 🕊️</div>

  <header>
    <a href="https://buymeacoffee.com/theikbhal" target="_blank" class="coffee-btn">
      ☕ Buy me a coffee
    </a>
    <h1>Curiosity → Cash</h1>
    <p>Real solo founders who monetized curiosity</p>
  </header>

  <main id="list">
    <p>Loading examples…</p>
  </main>

  <footer>
    Built in public • Calm curiosity • HTML + JSON
  </footer>

  <script>
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("list");
        list.innerHTML = "";

        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <span>#${item.id}</span>
            <p>${item.text}</p>
          `;
          list.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById("list").innerHTML =
          "<p>Failed to load data.</p>";
      });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curiosity → Cash</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #e5e7eb;
      background: radial-gradient(circle at top, #0f172a, #020617 70%);
      overflow-x: hidden;
    }

    /* --- soft animated background blobs --- */
    .blob {
      position: fixed;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      opacity: 0.12;
      filter: blur(40px);
      animation: breathe 16s ease-in-out infinite;
      pointer-events: none;
    }

    .blob.one { top: 10%; left: 5%; }
    .blob.two { bottom: 15%; right: 8%; animation-delay: -6s; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    /* --- curiosity objects (in-place motion) --- */
    .curious {
      position: fixed;
      font-size: 22px;
      opacity: 0.2;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }

    .curious.one { top: 30%; left: 8%; animation-delay: 0s; }
    .curious.two { top: 55%; right: 10%; animation-delay: -2s; }
    .curious.three { bottom: 18%; left: 40%; animation-delay: -4s; }

    @keyframes float {
      0%   { transform: translateY(0) rotate(0deg) scale(1); }
      50%  { transform: translateY(-8px) rotate(6deg) scale(1.05); }
      100% { transform: translateY(0) rotate(0deg) scale(1); }
    }

    header {
      padding: 18px 16px;
      text-align: center;
      background: rgba(2,6,23,0.8);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #1e293b;
      position: relative;
      z-index: 2;
    }

    .coffee-btn {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 16px;
      font-size: 0.85rem;
      background: #facc15;
      color: #000;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
    }

    header h1 {
      font-size: 1.6rem;
      margin: 6px 0 4px;
    }

    header p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin: 0;
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(2,6,23,0.85);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(56,189,248,0.1);
    }

    .card span {
      font-size: 0.75rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .card p {
      margin: 6px 0 0;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.75rem;
      color: #64748b;
      position: relative;
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- animated background -->
  <div class="blob one"></div>
  <div class="blob two"></div>

  <!-- curiosity objects (no eyes) -->
  <div class="curious one">◯</div>
  <div class="curious two">△</div>
  <div class="curious three">⬡</div>

  <header>
    <a href="https://buymeacoffee.com/theikbhal" target="_blank" class="coffee-btn">
      ☕ Buy me a coffee
    </a>
    <h1>Curiosity → Cash</h1>
    <p>Real solo founders who monetized curiosity</p>
  </header>

  <main id="list">
    <p>Loading examples…</p>
  </main>

  <footer>
    Built in public • Curiosity-driven • HTML + JSON
  </footer>

  <script>
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("list");
        list.innerHTML = "";

        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <span>#${item.id}</span>
            <p>${item.text}</p>
          `;
          list.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById("list").innerHTML =
          "<p>Failed to load data.</p>";
      });
  </script>

</body>
</html>
